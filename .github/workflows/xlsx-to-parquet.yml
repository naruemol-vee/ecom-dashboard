name: Convert XLSX (from Release) to Parquet

# วิธีใช้:
# 1. สร้าง GitHub Release ใหม่ (หรือใช้ของเดิม) แล้วแนบไฟล์ xlsx เป็น Asset
#    เช่น สร้าง tag "data-2026-08-16" แล้วอัปโหลด data.xlsx เข้าไป
# 2. ไปที่ Actions > Convert XLSX (from Release) to Parquet > Run workflow
# 3. ใส่ release_tag / asset_name / output_path ตามที่ต้องการ แล้วกด Run

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag ที่แนบไฟล์ xlsx ไว้"
        required: true
        default: "data-latest"
      asset_name:
        description: "ชื่อไฟล์ xlsx ที่แนบใน Release"
        required: true
        default: "data.xlsx"
      sheet_name:
        description: "ชื่อ/index ของ sheet ที่จะอ่าน (ปล่อยว่าง = sheet แรก)"
        required: false
        default: "0"
      output_path:
        description: "path ปลายทางของไฟล์ parquet ใน repo"
        required: true
        default: "public/data.parquet"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas pyarrow openpyxl

      - name: Download xlsx from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ inputs.asset_name }}" \
            --output input.xlsx \
            --clobber

      - name: Convert xlsx to parquet (3 sheets → combined parquet)
        run: |
          python <<'EOF'
          import pandas as pd
          import os

          sheets = ['DOS', 'TOS-OLD', 'TOS-New']
          dfs = []
          for s in sheets:
              df = pd.read_excel("input.xlsx", sheet_name=s)
              # แปลงทุก column เป็น string ก่อน เพื่อป้องกัน mixed-type (bool/int/str) ใน Excel
              df = df.astype(str).replace({'nan': '', 'None': '', 'NaT': ''})
              df.insert(0, '_sheet', s)
              dfs.append(df)
              print(f"  อ่าน {s}: {len(df):,} แถว x {len(df.columns)} คอลัมน์")

          combined = pd.concat(dfs, ignore_index=True).fillna('')
          out_path = "${{ inputs.output_path }}"
          os.makedirs(os.path.dirname(out_path) or ".", exist_ok=True)
          combined.to_parquet(out_path, engine="pyarrow", compression="snappy", index=False)

          size_mb = os.path.getsize(out_path) / 1024 / 1024
          print(f"บันทึกไฟล์แล้ว: {out_path} ({size_mb:.2f} MB, {len(combined):,} แถว)")
          print(f"_sheet values: {combined['_sheet'].unique().tolist()}")
          EOF

      - name: Commit and push parquet file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.output_path }}"
          git diff --cached --quiet && echo "ไม่มีการเปลี่ยนแปลง ข้าม commit" || \
            git commit -m "chore: update parquet from ${{ inputs.asset_name }} (release: ${{ inputs.release_tag }})"
          git push
